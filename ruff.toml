# Exclude AI runner scripts from the lint runner
exclude = [
    "ai_engineer",
]

[lint]
# Suppress non-critical lint rules (same class as Earthquake Tracker / ADSB / HA-Weerplaza)
ignore = [
    "BLE001",  # Do not catch blind exception
    "TRY002",  # Custom exception creation
    "PLR1722", # Built-in exit() call
    "S110",    # try-except-pass logging
    "B023",    # Loop variable binding
    "PIE810",  # Multiple startswith calls
    "DTZ005",  # datetime.now without tz
    "DTZ001",  # datetime() without tzinfo
    "TRY401",  # redundant exception in logging.exception
    "SIM103",  # return negated condition (style)
    "SIM102",  # nested if (style)
    "SIM117",  # nested with (aiohttp session+response pattern)
    "ASYNC230", # blocking open in async (debug path; non-critical)
    "PERF102",
    "S112",
    "RUF012",
    "RUF059",
    "DTZ011",
    "DTZ901",
    "SIM118",
]
